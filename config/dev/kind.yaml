kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kcp-marketplace
nodes:
  - role: control-plane
    extraPortMappings:
      # kcp-front-proxy NodePort -> host:8443
      - containerPort: 31443
        hostPort: 8443
        protocol: TCP
      # Dex NodePort -> host:5556
      - containerPort: 31556
        hostPort: 5556
        protocol: TCP
      # marketplace SPA / ingress -> host:8080 (later)
      - containerPort: 31080
        hostPort: 8080
        protocol: TCP
