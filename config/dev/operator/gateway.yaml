apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  # Fake in-service-CIDR IP so envoy readies the gateway; the shards/front-proxy
  # hostAlias the kcp hostnames to this IP for in-cluster SNI routing.
  addresses:
    - type: IPAddress
      value: 10.96.2.2
  gatewayClassName: eg
  listeners:
    - name: passthrough
      protocol: TLS
      port: 8443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
---
# Pin a NodePort for the envoy gateway so kind can expose it on the host
# (extraPortMappings 31443 -> 8443). Selects the controller-generated envoy pods.
apiVersion: v1
kind: Service
metadata:
  name: eg-nodeport
  namespace: envoy-gateway-system
spec:
  type: NodePort
  selector:
    gateway.envoyproxy.io/owning-gateway-name: eg
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 31443
